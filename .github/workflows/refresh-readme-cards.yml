name: Refresh README cards

on:
  schedule:
    # Daily at 08:17 Asia/Shanghai (00:17 UTC).
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-readme-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Refresh card URLs
        run: |
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import re
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("Asia/Shanghai"))
          version = now.strftime("%Y%m%d%H%M%S")
          path = Path("README.md")

          def refresh(match):
              url = urlsplit(match.group(1))
              params = dict(parse_qsl(url.query))
              params["v"] = version
              if "commits_year" in params:
                  params["commits_year"] = str(now.year)
              return 'src="' + urlunsplit(url._replace(query=urlencode(params))) + '"'

          updated, count = re.subn(
              r'src="(https://github-readme-stats-alpha-flax\.vercel\.app/[^"\s]+)"',
              refresh,
              path.read_text(),
          )
          if count != 2:
              raise SystemExit(f"Expected 2 card URLs, found {count}")
          path.write_text(updated)
          PY

      - name: Commit and push
        run: |
          git diff --check
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Refresh README cards'
          git pull --rebase origin main
          git push origin HEAD:main
